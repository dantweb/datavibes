[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datavibes"
version = "0.1.0"
description = "A standalone, config-driven toolkit for collecting data and generating datasets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSL-1.1" }
authors = [{ name = "vbwd" }]
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
parquet = ["pyarrow>=12.0"]
report = ["anthropic>=0.40", "fpdf2>=2.7", "matplotlib>=3.7", "markdown>=3.5"]
# OpenAI-compatible providers (DeepSeek, OpenAI, local servers, …):
openai = ["openai>=1.0"]
# Full-fidelity HTML/CSS report template (needs system pango/cairo):
report-html = ["weasyprint>=60"]

[project.scripts]
datavibes = "datavibes.cli:main"

[tool.setuptools.packages.find]
include = ["datavibes*"]

[tool.setuptools.package-data]
# Ship the default HTML report template inside the wheel so a pip-only
# install renders the full report (no working tree required).
"datavibes.report" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
