metadata:
  slug: vehicle-production-ev-share
  title: Vehicle Sales — EV Share & Adoption Speed
  category: mobility
  license: "IEA Global EV Data (free terms)"
  update_frequency: daily
  attribution: "IEA Global EV Data Explorer"

schema:
  - { name: country,         dtype: str }
  - { name: year,            dtype: int }
  - { name: ev_sales,        dtype: float, unit: "vehicles", nullable: true }
  - { name: ev_share_pct,    dtype: float, unit: "%", nullable: true, description: "EV % of new car sales" }
  - { name: charging_points, dtype: float, unit: "count", nullable: true }
  - { name: ev_cagr_5y,      dtype: float, unit: "%", nullable: true, description: "5y CAGR of EV sales share" }
  - { name: ev_infra_corr,   dtype: float, nullable: true, description: "corr(EV share, charging points) per country" }

sources:
  - type: iea-ev
    category: Historical
    years: [2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    metrics:
      - { parameter: "EV sales",          column: ev_sales,        mode: Cars, powertrains: [BEV, PHEV, FCEV] }
      - { parameter: "EV sales share",    column: ev_share_pct,    mode: Cars, powertrains: [EV] }
      - { parameter: "EV charging points", column: charging_points, mode: EVSE }

processing:
  - normalize
  - sort:   { by: [country, year] }
  - derive: { column: ev_cagr_5y,    expr: "cagr(ev_share_pct, years=5)", by: [country] }
  - derive: { column: ev_infra_corr, expr: "corr(ev_share_pct, charging_points)", by: [country] }
  - validate

charts:
  - type: bar
    title: "EV sales by market (2024)"
    x: country
    y: ev_sales
    filter: { year: 2024 }
    sort:   { by: ev_sales, desc: true }
    limit:  15
  - type: bar
    title: "Highest EV sales share (2024)"
    x: country
    y: ev_share_pct
    filter: { year: 2024 }
    sort:   { by: ev_share_pct, desc: true }
    limit:  15
  - type: scatter
    title: "EV share vs. charging points (2024)"
    x: charging_points
    y: ev_share_pct
    filter: { year: 2024 }
